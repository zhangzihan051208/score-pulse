<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>确认你的看台账号</title>
  </head>
  <body style="margin:0;padding:0;background:#0c0c10;color:#f4f1ea;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0c0c10;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#16141a;border:1px solid rgba(255,255,255,0.08);border-radius:16px;">
            <tr>
              <td style="padding:28px 28px 8px;font-family:Georgia,'Times New Roman',serif;font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:#e4572e;">
                Grandstand · 看台
              </td>
            </tr>
            <tr>
              <td style="padding:8px 28px 0;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.25;color:#f7f4ee;">
                确认邮箱，进看台
              </td>
            </tr>
            <tr>
              <td style="padding:14px 28px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.7;color:rgba(247,244,238,0.78);">
                这封信用来确认 {{ .Email }} 是你的。点下面的按钮，就能给今晚的比赛打分。
              </td>
            </tr>
            <tr>
              <td style="padding:22px 28px 8px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#e4572e;color:#fffaf6;text-decoration:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;font-weight:700;padding:12px 22px;border-radius:10px;">
                  确认邮箱
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 28px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;line-height:1.6;color:rgba(247,244,238,0.45);">
                Confirm this address to rate the match tonight. If you did not sign up for Grandstand, you can ignore this email.
              </td>
            </tr>
            <tr>
              <td style="padding:18px 28px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:12px;line-height:1.6;color:rgba(247,244,238,0.38);">
                看台 Grandstand · 评这一夜，不看名气
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
